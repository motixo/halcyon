per — warm light desktop</h2><a href="03-paper.png">Full image</a></div><img src="03-paper.png" alt="Paper — warm light desktop" width="1586" height="992"><figcaption>Light desktop. Analogue clock, Notes and Focus with quiet surfaces.</figcaption></figure><figure id="04-carbon"><div class="heading"><h2>Carbon — compact technical desktop</h2><a href="04-carbon.png">Full image</a></div><img src="04-carbon.png" alt="Carbon — compact technical desktop" width="1586" height="992"><figcaption>Compact desktop. Monospaced text, small meters and restrained accents.</figcaption></figure><figure id="05-canvas"><div class="heading"><h2>Desktop canvas — direct visual editing</h2><a href="05-canvas.png">Full image</a></div><img src="05-canvas.png" alt="Desktop canvas — direct visual editing" width="1586" height="992"><figcaption>Direct visual editing backed by shared measurement, layout and a scoped draft.</figcaption></figure><figure id="06-widget-builder"><div class="heading"><h2>Widget builder — personal components</h2><a href="06-widget-builder.png">Full image</a></div><img src="06-widget-builder.png" alt="Widget builder — personal components" width="1586" height="992"><figcaption>Reusable parts backed by stable instances, trusted data and bounded actions.</figcaption></figure><figure id="07-community"><div class="heading"><h2>Community setups — discover, preview, remix</h2><a href="07-community.png">Full image</a></div><img src="07-community.png" alt="Community setups — discover, preview, remix" width="1586" height="992"><figcaption>Discovery and remix after portable local packages work.</figcaption></figure><figure id="08-ridge"><div class="heading"><h2>Ridge — the clock becomes part of the picture</h2><a href="08-ridge.png">Full image</a></div><img src="08-ridge.png" alt="Ridge — the clock becomes part of the picture" width="1586" height="992"><figcaption>Clock behind a prepared landscape foreground. Alignment and fallback require a prototype.</figcaption></figure><figure id="09-spine"><div class="heading"><h2>Spine — a vertical desktop</h2><a href="09-spine.png">Full image</a></div><img src="09-spine.png" alt="Spine — a vertical desktop" width="1586" height="992"><figcaption>Vertical composition using a standard COSMIC panel; vertical Islands support is not assumed.</figcaption></figure><figure id="10-moments"><div class="heading"><h2>Moments — one setup through the day</h2><a href="10-moments.png">Full image</a></div><img src="10-moments.png" alt="Moments — one setup through the day" width="1586" height="992"><figcaption>A setup through the day, using explicit visual overrides and scheduled transitions.</figcaption></figure><figure id="11-mix-board"><div class="heading"><h2>Mix board — combine the parts you like</h2><a href="11-mix-board.png">Full image</a></div><img src="11-mix-board.png" alt="Mix board — combine the parts you like" width="1586" height="992"><figcaption>Combine a picture, a style and a layout through one coherent preview and plan.</figcaption></figure><figure id="12-type-wall"><div class="heading"><h2>Type wall — choose by looking</h2><a href="12-type-wall.png">Full image</a></div><img src="12-type-wall.png" alt="Type wall — choose by looking" width="1586" height="992"><figcaption>Choose installed fonts through visual samples. Generated font rendering is illustrative.</figcaption></figure></main><script>window.addEventListener('load',()=>console.log(JSON.stringify({images:document.images.length,loaded:[...document.images].filter(i=>i.complete&&i.naturalWidth>0).length,overflow:document.documentElement.scrollWidth>innerWidth,height:document.documentElement.scrollHeight})));</script></body></html>

name: Combined native integration.2 qualification trial, NOT admitted
on:
  push:
    branches: [ci/qualification-inputs-025]
    paths:
      - '.github/workflows/combined-native-trial-025.yml'
      - 'private/combined-native-trial-025/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: combined-native-trial-025-only
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      WORK: /mnt/cnt025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require actual KVM and disk; create only owned output
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo mkdir "$WORK"
          sudo chown "$(id -u):$(id -g)" "$WORK"
          mkdir "$WORK/evidence"
          date -u > "$WORK/evidence/job-start.txt"
          printf '%s\n' "$GITHUB_SHA" > "$WORK/evidence/infra-commit.txt"
          printf '{"purpose":"combined native trial real preflight","run":"%s"}\n' "$GITHUB_RUN_ID" > "$WORK/evidence/tiny-receipt.json"
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin WORK="$WORK" python3 private/combined-native-trial-025/prerequisites.py
      - name: Supported action tiny upload, no custom action stdout capture
        id: tiny
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-native-trial-tiny-${{ github.run_id }}
          path: /mnt/cnt025/evidence/tiny-receipt.json
          retention-days: 90
          if-no-files-found: error
      - name: Real API retrieval, independent hash and exact member before restore
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          TINY_ID: ${{ steps.tiny.outputs.artifact-id }}
          TINY_DIGEST: ${{ steps.tiny.outputs.artifact-digest }}
        run: set -Eeuo pipefail; python3 -B private/combined-native-trial-025/verify_tiny.py
      - name: Scoped QEMU tools and full device preflight before image download
        timeout-minutes: 8
        run: set -Eeuo pipefail; bash private/combined-native-trial-025/runner-tools.sh 2>&1 | tee "$WORK/evidence/runner-tools.log"
      - name: Restore exact immutable prepared image once
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: set -Eeuo pipefail; python3 -u private/combined-native-trial-025/restore_prepared.py 2>&1 | tee "$WORK/evidence/restore.log"
      - name: Explicit named development inputs, not release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-native-trial-test-inputs-integration2-337dd0d-${{ github.run_id }}
          path: |
            private/combined-native-trial-025/test-input-packages/*.deb
            private/combined-native-trial-025/integration2.json
            private/combined-native-trial-025/package-pins.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Offline isolated companion trial and bounded public inputs
        timeout-minutes: 35
        run: set -Eeuo pipefail; node private/combined-native-trial-025/controller.cjs
      - name: Preserve outcomes even on failure
        if: always()
        run: |
          set -Eeuo pipefail
          if [ -d "$WORK/evidence" ]; then
            date -u > "$WORK/evidence/job-end.txt"
            df -B1 "$WORK" > "$WORK/evidence/final-disk.txt"
            free -b > "$WORK/evidence/final-memory.txt"
            if [ -f "$WORK/evidence/host-dpkg-before.sha256" ]; then sha256sum -c "$WORK/evidence/host-dpkg-before.sha256" > "$WORK/evidence/host-dpkg-unchanged.txt"; fi
            if [ -d "$WORK/trial/evidence" ]; then sudo cp -a "$WORK/trial/evidence" "$WORK/evidence/startup-vm"; fi
            find private/combined-native-trial-025 -type f -print0 | sort -z | xargs -0 sha256sum > "$WORK/evidence/recipe-hashes.txt"
            sudo chmod -R a+rX "$WORK/evidence"
          fi
      - name: Supported final evidence upload, public objects only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-native-trial-${{ github.run_id }}
          path: /mnt/cnt025/evidence/
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn

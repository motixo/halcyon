name: Promote reviewed release artifacts
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Reviewed immutable candidate artifact run ID
        required: true
      manifest_sha256:
        description: SHA256 of the independently reviewed release-manifest.json
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: halcyon-release-candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact reviewed bytes and full native acceptance
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python3 scripts/compatibility/release_gate.py --artifacts candidate --manifest-sha256 "$MANIFEST_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.run_id }}
          path: candidate
          retention-days: 7
# Group 4's restricted promotion job consumes these exact verified bytes. No tag
# push auto-builds or publishes a fresh unqualified main/companion package. No
# credentials reach candidate code or native guests. Actual publication remains
# explicitly parent-owned until combined APT/UI acceptance is implemented.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config pkgconf cmake just \
            libxkbcommon-dev libwayland-dev libexpat1-dev libfontconfig-dev \
            fonts-open-sans fonts-noto-mono \
            libfreetype-dev libinput-dev libudev-dev libdbus-1-dev libseat-dev \
            libegl1-mesa-dev libvulkan-dev libssl-dev libclang-dev \
            dpkg-dev appstream desktop-file-utils lintian python3
      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
      - uses: Swatinem/rust-cache@v2
      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net packaging/io.github.profilaz3.Halcyon.metainfo.xml
          desktop-file-validate packaging/io.github.profilaz3.Halcyon.desktop
      - name: Build release binary
        run: cargo build --release --locked
      - name: Test activity collector
        run: |
          node --test scripts/usage/collector*.test.cjs
          python3 -m unittest discover -s scripts/usage -p 'test_*.py'
      - name: Test Python helpers and packaging
        run: |
          for test in scripts/test_*.py; do
            python3 "$test"
          done
          python3 -m unittest scripts/test_controller.py
          HALCYON_TEST_BINARY="$GITHUB_WORKSPACE/target/release/halcyon" \
            python3 -m unittest scripts.test_controller_transaction
          python3 -m unittest discover -s packaging -p 'test_*.py'
          python3 -m unittest discover -s packaging/updates -p 'test_*.py'
          python3 packaging/islands/test_islands.py
          python3 -m unittest companion.test_compatibility
          python3 -m unittest discover -s companion -p 'test_configured_applets.py'
          python3 -m unittest discover -s companion -p 'test_practical_compatibility.py'
          PYTHONPATH=companion python3 -m unittest companion.test_owned_group companion.test_install_status companion.test_enable_path companion.test_refresh.Refresh companion.test_restart
          PYTHONPATH=companion:scripts/compatibility python3 -m unittest discover -s scripts/compatibility -p 'test_practical_release.py'
      - name: Test Rust
        run: cargo test --locked -- --test-threads=1
      - name: Upload failed layout evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-failure-${{ github.run_number }}
          path: target/test-failures/
          if-no-files-found: ignore
          retention-days: 3
      - name: Test Islands core
        run: cargo test --locked --manifest-path companion/dock-islands-core/Cargo.toml
      - name: Install license report generator
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: Collect dependency licenses
        run: |
          cargo metadata --locked --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/cargo-metadata.json"
          python3 packaging/collect-licenses.py \
            --metadata "$RUNNER_TEMP/cargo-metadata.json" \
            --cargo-home "${CARGO_HOME:-$HOME/.cargo}" --allow-missing \
            --out "$RUNNER_TEMP/source-license-notices.txt"
          mkdir -p packaging/licenses
          cargo about generate --locked --fail \
            --config packaging/licenses/about.toml packaging/licenses/about.hbs \
            --output-file packaging/licenses/THIRD_PARTY_LICENSES.txt
          cat "$RUNNER_TEMP/source-license-notices.txt" >> packaging/licenses/THIRD_PARTY_LICENSES.txt
      - name: Build Debian package
        run: |
          python3 packaging/build-deb.py --binary target/release/halcyon \
            --version "$(dpkg-parsechangelog --file packaging/debian/changelog --show-field Version)~ci${GITHUB_RUN_NUMBER}" --out dist
      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-deb-${{ github.run_number }}
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
          retention-days: 3

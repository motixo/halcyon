name: Disposable COSMIC 1.11 guest builder
on:
  push:
    branches: [ci/qualification-probe-021]
    paths:
      - '.github/workflows/qualification-guest-builder.yml'
      - 'private/qualification-021/*.sh'
      - 'private/qualification-021/*.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cosmic-guest-builder-021
  cancel-in-progress: false
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install disposable runner tools
        shell: bash
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/cosmic/evidence" "$RUNNER_TEMP/cosmic/retain"
          # Azure mirror was measured at ~30 KiB/s on one runner. Retain the
          # Ubuntu signing root and use the main official mirror for tooling.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q 2>&1 | tee "$RUNNER_TEMP/cosmic/evidence/runner-apt-update.log"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y qemu-system-x86 qemu-utils ovmf squashfs-tools gdisk dosfstools zstd python3-pil aria2 2>&1 | tee "$RUNNER_TEMP/cosmic/evidence/runner-tools.log"
      - name: Verify official ISO and signing inputs
        timeout-minutes: 20
        run: sudo env WORK="$RUNNER_TEMP/cosmic" bash private/qualification-021/build.sh inputs 2>&1 | tee "$RUNNER_TEMP/cosmic/evidence/inputs.log"
      - name: Install full signed package cohort onto disk
        timeout-minutes: 65
        run: sudo env WORK="$RUNNER_TEMP/cosmic" bash private/qualification-021/build.sh install 2>&1 | tee "$RUNNER_TEMP/cosmic/evidence/install.log"
      - name: Boot real greeter and exercise stock login session
        timeout-minutes: 15
        run: sudo env WORK="$RUNNER_TEMP/cosmic" bash private/qualification-021/build.sh exercise 2>&1 | tee "$RUNNER_TEMP/cosmic/evidence/boot.log"
      - name: Make owned retained inputs readable for artifact upload
        if: always()
        run: sudo chmod -R a+rX "$RUNNER_TEMP/cosmic/evidence" "$RUNNER_TEMP/cosmic/retain"
      - name: Preserve bounded evidence on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cosmic-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/cosmic/evidence/
          retention-days: 7
          compression-level: 6
      - name: Preserve exact inputs and disposable disk
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cosmic-retained-${{ github.run_id }}
          path: ${{ runner.temp }}/cosmic/retain/
          retention-days: 7
          compression-level: 0
